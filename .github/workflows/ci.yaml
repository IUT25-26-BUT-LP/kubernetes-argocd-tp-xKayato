name: CI & SecOps Pipeline

on:
  push:
    branches: [ "main" ]
    # On évite la boucle infinie : on ignore les modifications faites par le bot
    paths-ignore:
      - 'k8s/**'

env:
  IMAGE_NAME: core.harbor.domain/hackathon/api # URL HARBOR

jobs:
  build-scan-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Build de l'image Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Scan de vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Bloque le pipeline si on trouve une faille
          severity: 'CRITICAL' # On bloque les failles hautes et critiques

      - name: Connexion et Push sur Harbor
        run: |
          # N'oubliez pas de configurer ces secrets dans GitHub (Settings > Secrets and variables)
          docker login core.harbor.domain -u ${{ secrets.HARBOR_USER }} -p ${{ secrets.HARBOR_TOKEN }}
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Mise à jour du manifeste Kubernetes (GitOps)
        run: |
          # On remplace l'ancien tag par le nouveau (le SHA du commit)
          sed -i "s|image: ${{ env.IMAGE_NAME }}:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml
          
          # On pousse la modification sur GitHub
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Auto-deploy: update image to ${{ github.sha }}"
          git push