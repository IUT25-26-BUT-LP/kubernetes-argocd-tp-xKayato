name: CI & SecOps

on:
  push:
    branches: [ "main" ]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t mon-harbor.com/hackathon/api:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mon-harbor.com/hackathon/api:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fait échouer le pipeline si des failles sont trouvées
          severity: 'CRITICAL,HIGH' # On bloque les failles critiques et hautes

      - name: Push to Harbor (Si Trivy est OK)
        run: |
          docker login mon-harbor.com -u ${{ secrets.HARBOR_USER }} -p ${{ secrets.HARBOR_TOKEN }}
          docker push mon-harbor.com/hackathon/api:${{ github.sha }}
