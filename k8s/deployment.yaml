apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-hackathon
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/VOTRE_USER/mon-repo-hackathon.git'
    targetRevision: main
    path: k8s # 👈 ArgoCD ne lira QUE ce dossier !
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
